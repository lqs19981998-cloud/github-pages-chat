name: Supabase Keepalive

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase Data API
        run: |
          set -euo pipefail
          status=$(curl -sS -o /tmp/keepalive.json -w "%{http_code}" \
            "https://lljblinqccydassokspa.supabase.co/rest/v1/messages?select=id&limit=1" \
            -H "apikey: sb_publishable_yanZsKJCotPg7Bp4kdPJXQ_Qqe91gSw" \
            -H "Authorization: Bearer sb_publishable_yanZsKJCotPg7Bp4kdPJXQ_Qqe91gSw")
          echo "HTTP status: ${status}"
          cat /tmp/keepalive.json
          if [ "${status}" -lt 200 ] || [ "${status}" -ge 300 ]; then
            echo "Keepalive request failed"
            exit 1
          fi
